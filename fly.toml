# fly.toml app configuration file generated for rogs-umbrella on 2025-12-13T02:10:02+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rogs-umbrella'
primary_region = 'nrt'

[env]
  PHX_HOST = 'rogs-umbrella.fly.dev'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
